<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simpleloop Logic Solver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">
    <!-- Sidebar -->
    <div class="w-full md:w-80 bg-white border-r border-gray-200 p-6 flex flex-col gap-6 shadow-sm z-10 overflow-y-auto shrink-0">
        <!-- Header -->
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent flex items-center gap-2">
                <!-- Grid Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
                Simpleloop
            </h1>
            <p class="text-sm text-gray-500 mt-1">Logic Solver & Visualizer (Static)</p>
        </div>

        <!-- Configuration -->
        <div class="space-y-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 flex items-center gap-2">Configuration</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Width</label>
                    <input type="number" id="input-cols" value="5" min="3" max="20" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-gray-100 disabled:text-gray-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Height</label>
                    <input type="number" id="input-rows" value="5" min="3" max="20" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-gray-100 disabled:text-gray-400">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-700 mb-1 flex items-center gap-1">Solve Speed (ms)</label>
                    <input type="number" id="input-speed" value="20" min="1" max="2000" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="bg-blue-50 p-3 rounded-md text-xs text-blue-800 flex gap-2">
                 <span class="mt-0.5">ℹ️</span>
                 <p>Click cells to toggle <strong>Black Squares</strong> (obstacles) before solving.</p>
            </div>
        </div>

        <!-- Import -->
        <div class="space-y-2">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Import</h2>
            <div class="flex gap-2">
                <input type="text" id="input-import" placeholder="Paste URL..." class="flex-1 px-3 py-2 text-xs border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="btn-import" class="bg-gray-800 text-white px-3 py-2 rounded-md hover:bg-gray-900 disabled:opacity-50 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                </button>
            </div>
        </div>

        <!-- Actions -->
        <div class="space-y-3 flex-1">
             <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Actions</h2>
             <button id="btn-step" class="w-full flex items-center justify-center gap-2 bg-white border-2 border-indigo-600 text-indigo-700 hover:bg-indigo-50 px-4 py-2.5 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Step Once
             </button>
             <button id="btn-auto" class="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white hover:bg-indigo-700 px-4 py-2.5 rounded-lg font-medium transition-colors">
                Auto Solve
             </button>
             <button id="btn-reset" class="w-full flex items-center justify-center gap-2 bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2.5 rounded-lg font-medium transition-colors">
                Reset
             </button>
        </div>

        <!-- Legend -->
        <div class="mt-auto border-t pt-4">
           <h3 class="text-xs font-semibold text-gray-500 mb-2">Legend</h3>
           <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="flex items-center gap-2"><div class="w-4 h-4 bg-black rounded-sm"></div> Obstacle</div>
              <div class="flex items-center gap-2"><div class="w-4 h-0.5 bg-indigo-600"></div> Solid Line</div>
              <div class="flex items-center gap-2"><div class="w-4 h-0.5 border-t-2 border-amber-500 border-dashed"></div> Dashed Line</div>
              <div class="flex items-center gap-2"><div class="text-red-500 font-bold">X</div> No Path</div>
           </div>
        </div>
    </div>

    <!-- Canvas Area -->
    <div class="flex-1 bg-gray-50 overflow-auto flex items-center justify-center p-8" id="canvas-container">
        <div class="bg-white p-4 rounded-xl shadow-lg border border-gray-200 relative">
            <canvas id="gridCanvas"></canvas>
            <div id="status-badge" class="hidden absolute top-2 right-2 px-2 py-1 bg-indigo-100 text-indigo-700 text-xs rounded-full font-medium pointer-events-none">Solving Mode</div>
        </div>
    </div>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
